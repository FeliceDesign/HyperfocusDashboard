name: focus_ledger
description: "Non Finito — ein Dashboard für kreative Projekte, das nicht motiviert, sondern konfrontiert."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  path_provider: ^2.1.4
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# Launcher-Icon: der Non-Finito-Ring (ink auf bg). Die PNG-Quellen werden im
# CI von tool/gen_icon.py erzeugt (Ring mit butt-Enden), danach backt
# flutter_launcher_icons daraus die Android-Mipmaps.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#101215"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
