name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - "claude/**"
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # Platform folders are not committed — generate a matching Android
      # scaffold for the installed Flutter version. `flutter create` never
      # overwrites existing files (lib/, pubspec.yaml stay as-is).
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.felicedesign --project-name focus_ledger .

      - name: Set launcher label to "Focus Ledger"
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label="focus_ledger"/android:label="Focus Ledger"/' "$MANIFEST"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: focus-ledger-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Also publish a rolling pre-release with the APK for easy download.
      - name: Publish rolling release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Focus Ledger build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          prerelease: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
